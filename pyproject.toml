[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kriptty"
version = "0.2.0"
description = "Kriptty Puda Strategy — sistema multi-subcuenta para Bitget con Stop Loss obligatorio y servidor MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.5.80",
    "mcp[cli]>=2.2",
    "aiohttp>=3.12",
    "numpy>=2.2",
    "pandas>=2.2",
    "APScheduler>=3.11,<4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "feedparser>=6.0.11",
    "vaderSentiment>=3.3.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
finbert = ["transformers>=4.50", "torch>=2.6"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.8"]

[project.scripts]
kriptty-engine = "kriptty.engine:cli"
kriptty-mcp = "kriptty.mcp_server:cli"
kriptty-backtest = "kriptty.backtest:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/kriptty"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kriptty"]
